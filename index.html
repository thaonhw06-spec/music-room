<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cassie Loveletters | Music Room</title
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghKCXvvqHboJEios2Mk_gSdWU9D99lWRGGfazPdc46OoF9ua3WuHEo4IQ-_YfcDpf0o-BzAMtm5qVOeVoXYdlshfZMwIY68TZgkFE8fcIy3jziEkGf-xnrI55-Q8gd1vSdkTtP3WqeBzGP4sMeXkLL9GuXRN3ok5dTkC8Cu1VH8kHNXOpE1SCU3XSQJsU/s1600/cd_drive-2.png" />                                       
  <meta name="description" content="A retro desktop for favorite songs and films." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet" /></noscript>

  <style>
    :root {
      --body: #a8998b;       /* thân cửa sổ, nút */
      --title: #9bc9ec;      /* thanh tiêu đề */
      --title-ink: #35537b;  /* chữ tiêu đề */
      --lcd: #fcffbc;        /* ô hiển thị */
      --hi: #dfdfdf;         /* viền sáng */
      --ink: #000;
      --soft: #7b6a5d;       /* chữ phụ */
      --olive: #736d34;
      --olive-deep: #4f4b26;
      --panel: #ddd3c8;      /* nền vùng nội dung */
      --lilac: #d9c3ec;
      --bar: 40px;
      --px: "Pixelify Sans", "VT323", monospace;
      --lcdfont: "VT323", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: var(--lcdfont);
      font-size: 20px;
      color: var(--ink);
      background: #1b1a12;
      -webkit-user-select: none; user-select: none;
    }
    /* ===== "màn hình" giới hạn độ rộng ở giữa trang, ảnh nền vừa khít, không mờ ===== */
    :root {
      --bg-url: url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjHAaN1Se-X_9Eb7YBwC4qvXT-YgSai_730Ks2SDgF2YvpMNJE99v7_AGVOrsTuDK82P7HgziHnjUIUUe9QxqSOpXD5USxgKMYCHWowy5_Q0bFkvS59-918G6UUqpXhDId1oIfhd533GRrE2bTK14rgLKL3PMdbBxScMxduFvlb5AGYya3jMh_EDGChnlg/s1600/IMG_8587%20Large.png");
      --max-ar: 1.6;           /* màn hình KHÔNG rộng hơn tỉ lệ này (1.6 = 16:10). Trình duyệt rộng hơn thì hai bên để màu nâu tối. Giảm (vd 1.3) = ảnh ít bị cắt/ít phóng to hơn; đặt 99 = luôn phủ kín trình duyệt */
      --bg-pos: 30% 80%;       /* phần ảnh được giữ lại khi cắt: 50% 0% = giữ phần trên, 50% 100% = giữ phần dưới */
    }
    body {
  background: #a8998b url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjh6Lper3WUWCHWwB33IgOTEfaK_CP7kJcqxGS1f8LG-6WWJzsjI0Gr0DH2U9DtkpLyN24p2PJ59DwJ1TI6ZbtPj4Ul5A_K6O_korhGCCqBjhK3AqN5JRLFbvIEygG2k93Ee_WVGZA6c1L8vjJpXoDN5zH0lHRhSHLBIMoRoekcMwcNij2s3lLD4tbgjyQ/s1600/%E2%9D%A6.jpeg") repeat;
  background-size: 300px auto;
  -webkit-tap-highlight-color: transparent;
}
    .monitor { position: fixed; inset: 0; margin: auto; overflow: hidden; background: #1b1a12;
      width: 100vw; height: 100vh; max-width: calc(100vh * var(--max-ar));
      container-type: size; transform: translateZ(0);
      box-shadow: 0 0 0 4px #000, 0 16px 60px rgba(0,0,0,.6); }
    @supports (height: 100dvh) { .monitor { height: 100dvh; max-width: calc(100dvh * var(--max-ar)); } }
    .bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: #1b1a12; }
    .bg-photo { position: absolute; inset: 0; background: var(--bg-url) var(--bg-pos) / cover no-repeat; }
    /* lớp tối nhẹ để chữ icon luôn đọc được */
    .bg::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.16); }
    img { image-rendering: pixelated; }
    button { font: inherit; color: inherit; }

    /* ---------- bevel dùng chung ---------- */
    .raised { background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); }
    .sunken { border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); }

    /* ---------- desktop icons ---------- */
    .desktop { position: fixed; inset: 0 0 var(--bar) 0; }
    /* icon đặt lệch nhau một chút cho đỡ gọn gàng: chỉnh left/top ở đây */
    .icon { position: absolute; width: 84px; padding: 6px 4px; background: none; border: 0; cursor: pointer; text-align: center; color: #fff; }
    .icon[data-open="music"] { left: 3.5%; top: 9%; }
    .icon[data-open="film"]  { left: 9.5%; top: 31%; }
    .icon img { width: 48px; height: 48px; display: block; margin: 0 auto 6px; }
    .icon span { display: inline-block; max-width: 100%; padding: 0 4px; font-size: 20px; line-height: 1.05; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
    .icon.sel span, .icon:focus-visible span { background: var(--olive); outline: 1px dotted var(--lcd); text-shadow: none; }
    .icon.sel img, .icon:focus-visible img { filter: sepia(1) saturate(2) hue-rotate(20deg) brightness(.8); }
    .icon:focus { outline: none; }
    .marquee { position: absolute; display: none; pointer-events: none; z-index: 5; border: 1px dotted var(--lcd); background: rgba(252, 255, 188, .18); }

    /* ---------- cửa sổ ---------- */
    .win { position: fixed; display: none; flex-direction: column; width: min(600px, calc(100cqw - 230px)); height: min(430px, calc(100cqh - var(--bar) - 70px)); background: var(--body); border: 2px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); box-shadow: none; }
    .win.open { display: flex; }
    .win.min { display: none; }
    .win.max { inset: 0 0 var(--bar) 0 !important; width: auto; height: auto; box-shadow: none; }
    .titlebar { display: flex; align-items: center; gap: 10px; height: 46px; margin: 6px; padding: 0 6px 0 8px; background: var(--title); color: var(--title-ink); cursor: grab; touch-action: none; }
    .titlebar:active { cursor: grabbing; }
    .titlebar img { width: 28px; height: 28px; flex: none; }
    .titlebar h2 { flex: 1; margin: 0; font: 600 25px/1 var(--px); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .win:not(.active) .titlebar { filter: saturate(.55) brightness(1.04); }
    .tb { width: 32px; height: 30px; padding: 0; display: grid; place-items: center; cursor: pointer; background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); box-shadow: 2px 2px 0 var(--ink); }
    .tb:active { border-color: var(--ink) var(--hi) var(--hi) var(--ink); box-shadow: none; transform: translate(2px,2px); }
    .tb svg { width: 14px; height: 14px; shape-rendering: crispEdges; }

    .addr { display: flex; gap: 8px; margin: 0 6px 6px; }
    .lcd { flex: 1; min-width: 0; padding: 2px 10px; background: var(--lcd); color: var(--title-ink); font-size: 24px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); }
    .btn { padding: 0 14px; background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); cursor: pointer; font-size: 22px; text-decoration: none; display: inline-flex; align-items: center; color: var(--ink); }
    .btn:active { border-color: var(--ink) var(--hi) var(--hi) var(--ink); }

    .content { flex: 1; min-height: 0; margin: 0 6px; padding: 14px; overflow: auto; background: var(--panel); border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); -webkit-user-select: text; user-select: text; scrollbar-color: var(--body) var(--panel); }
    .content::-webkit-scrollbar { width: 18px; height: 18px; }
    .content::-webkit-scrollbar-track { background: var(--panel); border-left: 2px solid var(--ink); }
    .content::-webkit-scrollbar-thumb { background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); }
    .status { margin: 6px; padding: 2px 10px; background: var(--lcd); color: var(--title-ink); font-size: 22px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); }

    /* lưới bìa */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 14px; }
    .item { display: block; padding: 4px; text-align: center; color: var(--ink); text-decoration: none; cursor: pointer; }
    .item .cover { width: 100%; max-width: 120px; aspect-ratio: 1; margin: 0 auto 6px; display: grid; place-items: center; background: var(--body); border: 3px solid var(--ink); box-shadow: none; overflow: hidden; }
    .item .cover img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; display: block; }
    .item .cover.poster { aspect-ratio: 2/3; }
    .item .cover b { font: 600 34px var(--px); color: var(--hi); }
    .item span { display: inline-block; max-width: 100%; padding: 0 4px; font-size: 21px; line-height: 1.05; overflow-wrap: break-word; }
    .item:hover span, .item:focus-visible span { background: var(--olive); color: var(--lcd); }
    .item:focus { outline: none; }
    .item:hover .cover, .item:focus-visible .cover { transform: translate(-1px,-1px); box-shadow: none; }
    .empty { grid-column: 1 / -1; padding: 30px 10px; text-align: center; color: var(--soft); font-size: 24px; }

    /* ---------- taskbar ---------- */
    .taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: var(--body); border-top: 3px solid var(--hi); box-shadow: 0 -3px 0 var(--ink); z-index: 9000; }
    .start { display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px 0 8px; background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); cursor: pointer; font: 600 20px var(--px); }
    .start img { width: 22px; height: 22px; }
    .start.on, .start:active { border-color: var(--ink) var(--hi) var(--hi) var(--ink); }
    .tasks { display: flex; gap: 6px; flex: 1; min-width: 0; height: 100%; }
    .task { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 190px; flex: 0 1 190px; height: 100%; padding: 0 10px; background: var(--body); border: 3px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); cursor: pointer; font-size: 21px; }
    .task img { width: 20px; height: 20px; flex: none; }
    .task span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task.on { border-color: var(--ink) var(--hi) var(--hi) var(--ink); background: #b9ab9d; }
    .clock { height: 100%; padding: 0 12px; display: flex; align-items: center; background: var(--lcd); color: var(--title-ink); font-size: 22px; border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); white-space: nowrap; }

    .menu { position: fixed; left: 6px; bottom: var(--bar); display: none; min-width: 230px; padding: 4px; background: var(--body); border: 4px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); box-shadow: 6px 6px 0 var(--ink); z-index: 9500; }
    .menu.open { display: block; }
    .menu a, .menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 6px 10px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink); text-decoration: none; font-size: 24px; }
    .menu a:hover, .menu button:hover, .menu a:focus-visible, .menu button:focus-visible { background: var(--olive); color: var(--lcd); outline: none; }
    .menu img { width: 28px; height: 28px; }
    .menu hr { margin: 4px 2px; border: 0; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--hi); }

    /* ---------- boot / shutdown ---------- */
    .screen { position: fixed; inset: 0; z-index: 10000; background: #000; color: #e8c07a; display: grid; place-items: center; text-align: center; font-size: 30px; line-height: 1.3; padding: 20px; }
    .screen.hide { display: none; }
    .screen.fade { opacity: 0; transition: opacity .5s steps(5); pointer-events: none; }
    /* boot tự tắt bằng CSS thuần, không phụ thuộc JavaScript hay font */
    #boot { animation: bootout .4s steps(4) .7s forwards; }
    #boot { color: #7fb8ff; }   /* màu chữ "starting up": xanh lam */
    #off  { color: #ff9ecb; }   /* màu chữ ở màn hình shutdown: hồng */
    .offgif { display: block; margin: 0 auto 18px; max-width: min(60vw, 320px); max-height: 50vh; height: auto; image-rendering: auto; }
    @keyframes bootout { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } .screen.fade { transition: none; } }

    /* ---------- điện thoại ---------- */
    @media (max-width: 720px) {
      body { font-size: 19px; }
      .monitor { max-width: none; box-shadow: none; }
      .bg-photo { background-position: 50% 40%; }
      .icon[data-open="music"] { left: 6%; top: 8%; }
      .icon[data-open="film"]  { left: 30%; top: 17%; }
      .win, .win.max { inset: 10px 14px calc(var(--bar) + 14px) 10px !important; width: auto; height: auto; box-shadow: none; border-width: 3px; }
      .titlebar { cursor: default; }
      .tb[data-act="max"] { display: none; }
      .task { flex: 1 1 0; min-width: 0; }
      .clock { padding: 0 8px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px 10px; }
    }
    /* ===== ID MAKER ===== */
@font-face { font-family: "KiwiSoda"; src: url("KiwiSoda.ttf") format("truetype"); font-display: swap; }
.icon[data-open="id"] { left: 3.5%; top: 55%; }
.idwrap { display: grid; gap: 14px; grid-template-columns: 1fr; }
.idform { display: grid; gap: 8px; align-content: start; }
.idform label { display: grid; gap: 2px; font-size: 20px; color: var(--title-ink); }
.idform label.chk { display: flex; align-items: center; gap: 8px; }
.idform input[type=text], .idform input[type=date], .idform select { width: 100%; padding: 2px 8px; font: 22px var(--lcdfont); background: var(--lcd); color: var(--title-ink); border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); border-radius: 0; }
.idform input[type=file] { max-width: 100%; font: 20px var(--lcdfont); }
.idform input[type=range] { width: 100%; accent-color: var(--olive); }
.idprev canvas { display: block; width: 100%; height: auto; background: repeating-conic-gradient(#e9e0d6 0% 25%, #ddd3c8 0% 50%) 0 0 / 20px 20px; }
.idbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.idbtns .btn { height: 36px; }
@media (min-width: 721px) {
  #win-id { width: min(880px, calc(100cqw - 100px)); height: min(620px, calc(100cqh - var(--bar) - 40px)); }
  #win-id.max { width: auto; height: auto; }
  .idwrap { grid-template-columns: 250px 1fr; }
}
@media (max-width: 720px) {
  .icon[data-open="id"] { left: 56%; top: 8%; }
}
/* ===== MINI PLAYER ===== */
.icon[data-open="play"] { left: 13%; top: 54%; }
.icon[data-open="play"] img { object-fit: cover; image-rendering: auto; }
#win-play { width: 300px; height: auto; }
#win-play .titlebar { height: 28px; margin: 4px; padding: 0 4px 0 6px; gap: 6px; }
#win-play .titlebar img { width: 18px; height: 18px; object-fit: cover; image-rendering: auto; }
#win-play .titlebar h2 { font-size: 19px; }
#win-play .tb { width: 22px; height: 20px; border-width: 2px; box-shadow: 1px 1px 0 var(--ink); }
#win-play .tb svg { width: 10px; height: 10px; }
#win-play .tb[data-act="max"] { display: none; }
.pframe { margin: 0 4px; background: #000; border: 3px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); line-height: 0; min-height: 120px; }
.pframe img, .pframe canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
.pframe canvas { display: none; }
.pbar { display: flex; align-items: center; gap: 8px; margin: 4px; padding: 0 2px; }
.pbtn { width: 26px; height: 22px; padding: 0; flex: none; cursor: pointer; font: 600 14px/1 var(--px); color: var(--ink); background: var(--body); border: 2px solid; border-color: var(--hi) var(--ink) var(--ink) var(--hi); }
.pbtn:active { border-color: var(--ink) var(--hi) var(--hi) var(--ink); }
.ptrack { flex: 1; height: 10px; overflow: hidden; background: var(--lcd); border: 2px solid; border-color: var(--ink) var(--hi) var(--hi) var(--ink); }
.ptrack i { display: block; height: 100%; width: 30%; background: var(--olive); animation: pslide 2.4s linear infinite; }
#win-play.paused .ptrack i { animation-play-state: paused; }
@keyframes pslide { from { margin-left: -30%; } to { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { .ptrack i { animation: none; width: 100%; } }
@media (max-width: 720px) {
  .icon[data-open="play"] { left: 56%; top: 20%; }
  #win-play, #win-play.max { inset: auto 14px calc(var(--bar) + 20px) auto !important; width: min(300px, calc(100vw - 28px)); }
}    
  </style>
</head>

  <div class="monitor" id="monitor">
  <div class="bg" aria-hidden="true"><div class="bg-photo"></div></div>

  <!-- icon trên desktop -->
  <nav class="desktop" aria-label="Desktop">
    <button class="icon" data-open="music" type="button"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghKCXvvqHboJEios2Mk_gSdWU9D99lWRGGfazPdc46OoF9ua3WuHEo4IQ-_YfcDpf0o-BzAMtm5qVOeVoXYdlshfZMwIY68TZgkFE8fcIy3jziEkGf-xnrI55-Q8gd1vSdkTtP3WqeBzGP4sMeXkLL9GuXRN3ok5dTkC8Cu1VH8kHNXOpE1SCU3XSQJsU/s1600/cd_drive-2.png" alt="" /><span>music</span></button>

    <button class="icon" data-open="play" type="button"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiP_IKrvTpy5EeurY-Fn7LEr1hBxbnv1G1jaQIDVAVIwZJILc7pa04NnrrM2wpYQjeOl3jkEg-8-ddh6rcU4OexqKon-k8WGBu_4T3muWpb9rZbUWBpSoMNjGJ39LrbB_AX2bKrSbN9Mw-ZCG0eJ4gb7vT6FkgHzxpBDYoyKK7B1ngm5QxyX7NKegaYsdU/s1600/lacroixdaisy9.png" alt="" /><span>4laska1</span></button> 
  </nav>
    

  <!-- cửa sổ nhạc -->
  <section class="win" id="win-music" data-title="music_files" data-icon="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghKCXvvqHboJEios2Mk_gSdWU9D99lWRGGfazPdc46OoF9ua3WuHEo4IQ-_YfcDpf0o-BzAMtm5qVOeVoXYdlshfZMwIY68TZgkFE8fcIy3jziEkGf-xnrI55-Q8gd1vSdkTtP3WqeBzGP4sMeXkLL9GuXRN3ok5dTkC8Cu1VH8kHNXOpE1SCU3XSQJsU/s1600/cd_drive-2.png" aria-label="music_files" style="left:24%; top:6%;">
    <div class="titlebar">

    var wash = ctx.createLinearGradient(0, y, 0, y + h);
    wash.addColorStop(0, color); wash.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = amt * 0.35; ctx.fillStyle = wash; ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = amt; ctx.fillStyle = color;
    for (var row = 0, py = y; py < y + h + step; row++, py += step * 0.866) {
      var t = 1 - Math.min(Math.max((py - y) / h, 0), 1);
      var r = maxR * Math.pow(t, 0.85);
      if (r < 0.7) continue;
      for (var px = x - (row % 2 ? 0 : step / 2); px < x + w + step; px += step) {
        ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function draw() {
    var p = PAL[$("idPal").value] || PAL.sky;
    var name = ($("idName").value || "").trim() || "your name";
    var planet = ($("idPlanet").value || "").trim() || "-";
    var slogan = ($("idSlogan").value || "").trim().toUpperCase();
    var bv = $("idBirth").value;
    var birth = bv ? bv.replace(/-/g, "/") : "----/--/--";

    var W = cv.width, H = cv.height;
    var cx = 24, cy = 24, cw = 970, ch = 590;
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round";

    /* bóng + thân thẻ */
    rr(cx + 9, cy + 9, cw, ch, 46); ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fill();
    var g = ctx.createLinearGradient(0, cy, 0, cy + ch);
    g.addColorStop(0, p.top); g.addColorStop(0.5, p.mid); g.addColorStop(1, p.bot);
    rr(cx, cy, cw, ch, 46); ctx.fillStyle = g; ctx.fill();
if ($("idGrain").checked) {
  grainCv = grainCv || makeGrain(cw, ch);
  ctx.save();
  rr(cx, cy, cw, ch, 46); ctx.clip();
  ctx.globalAlpha = +$("idGrainAmt").value / 100;
  ctx.drawImage(grainCv, cx, cy);
  ctx.restore();
}
rr(cx, cy, cw, ch, 46);
ctx.lineWidth = 5; ctx.strokeStyle = p.ink; ctx.stroke();

    /* tên lớn */
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    fitFont(name, F_BIG, cw - 90, 150, 40);
    var tx = cx + cw / 2, ty = cy + 118;
    ctx.shadowColor = p.accent; ctx.shadowOffsetX = 7; ctx.shadowOffsetY = 7; ctx.shadowBlur = 0;
    ctx.lineWidth = 14; ctx.strokeStyle = p.ink; ctx.strokeText(name, tx, ty);
    ctx.shadowColor = "transparent"; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = "#fff"; ctx.fillText(name, tx, ty);

    /* avatar tròn */
    var ax = cx + 205, ay = cy + 372, ar = 138;
    ctx.beginPath(); ctx.arc(ax, ay, ar + 12, 0, Math.PI * 2);
    ctx.fillStyle = p.accent; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = p.ink; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.clip();
    if (photo) {
      var zoom = +$("idZoom").value / 100;
      var s = Math.max(2 * ar / photo.width, 2 * ar / photo.height) * zoom;
      var dw = photo.width * s, dh = photo.height * s;
      var ox = (+$("idX").value / 100) * Math.max(dw - 2 * ar, 0) / 2;
      var oy = (+$("idY").value / 100) * Math.max(dh - 2 * ar, 0) / 2;
      ctx.drawImage(photo, ax - dw / 2 + ox, ay - dh / 2 + oy, dw, dh);
    } else {
      ctx.fillStyle = p.pillB; ctx.fillRect(ax - ar, ay - ar, ar * 2, ar * 2);
      ctx.fillStyle = p.ink; ctx.font = "120px " + F_BIG;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", ax, ay + 6);
    }
    if ($("idHalf").checked) halftone(ax - ar, ay - ar, ar * 2, ar * 2, p.dot, +$("idHalfAmt").value / 100);
    ctx.restore();
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = p.ink; ctx.stroke();

    /* ba ô thông tin */
    var px0 = cx + 410, pw = cw - 410 - 48, ph = 84, gap = 20, py0 = cy + 232;
    var rows = [["NAME", name], ["BIRTH", birth], ["PLANET", planet]];
    rows.forEach(function (r, i) {
      var y = py0 + i * (ph + gap);
      var pg = ctx.createLinearGradient(0, y, 0, y + ph);
      pg.addColorStop(0, p.pillA); pg.addColorStop(1, p.pillB);
      rr(px0, y, pw, ph, ph / 2); ctx.fillStyle = pg; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = p.ink; ctx.stroke();
      ctx.textBaseline = "middle"; ctx.fillStyle = p.ink;
      ctx.textAlign = "left"; ctx.font = "28px " + F_SM; ctx.fillText(r[0], px0 + 32, y + ph / 2 + 2);
      ctx.textAlign = "right"; fitFont(r[1], F_BIG, pw - 64 - 150, 36, 18);
      ctx.fillText(r[1], px0 + pw - 32, y + ph / 2 + 2);
    });

    /* chân thẻ */
    ctx.fillStyle = p.ink; ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.font = "24px " + F_SM;
    ctx.fillText("IDENTIFICATION CARD", cx + 60, cy + 548);
    ctx.fillText("NO. " + cardNo, cx + 60, cy + 572);
    ctx.textAlign = "right"; fitFont(slogan, F_SM, 330, 24, 14);
    ctx.fillText(slogan, cx + cw - 60, cy + 560);
  }

  /* gắn sự kiện */
  ["idName", "idBirth", "idPlanet", "idSlogan", "idPal", "idZoom", "idX", "idY", "idHalf", "idHalfAmt", "idGrain", "idGrainAmt"].forEach(function (id) {
    $(id).addEventListener("input", draw);
    $(id).addEventListener("change", draw);
  });

  $("idPhoto").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      photo = im; $("idZoom").value = 100; $("idX").value = 0; $("idY").value = 0;
      draw(); URL.revokeObjectURL(url);
    };
    im.onerror = function () { URL.revokeObjectURL(url); };
    im.src = url;
  });

  $("idNo").addEventListener("click", function () {
    cardNo = String(Math.floor(10000000 + Math.random() * 89999999));
    draw();
  });

  $("idReset").addEventListener("click", function () {
    $("idName").value = "Stardust"; $("idBirth").value = ""; $("idPlanet").value = "Earth";
    $("idSlogan").value = "stay soft"; $("idPhoto").value = ""; $("idPal").value = "sky";
    $("idZoom").value = 100; $("idX").value = 0; $("idY").value = 0;
    $("idHalf").checked = true; $("idHalfAmt").value = 45;
    $("idGrain").checked = true; $("idGrainAmt").value = 40;
    photo = null; cardNo = todayNo(); draw();
  });

  $("idDl").addEventListener("click", function () {
    draw();
    cv.toBlob(function (b) {
      if (!b) return;
      var slug = ($("idName").value || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "card";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = "id-card-" + slug + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, "image/png");
  });

  /* vẽ lần đầu, rồi vẽ lại khi font đã tải xong */
  draw();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('40px "KiwiSoda"'), document.fonts.load('24px "VT323"')]).then(draw, draw);
  }
})(); 
  /* ================= MINI PLAYER (1 gif) ================= */
(function () {
  var img = document.getElementById("pgif"), cv = document.getElementById("pfrz");
  var btn = document.getElementById("pbtn"), win = document.getElementById("win-play");
  var playing = true;

  /* chỉ tải gif khi mở lần đầu cho nhẹ trang */
  function load() { if (!img.src) img.src = img.dataset.src; }
  document.querySelectorAll('[data-open="play"]').forEach(function (b) {
    b.addEventListener("click", load, { once: true });
  });

  function setPlay(p) {
    playing = p;
    win.classList.toggle("paused", !p);
    btn.textContent = p ? "II" : ">";
    btn.setAttribute("aria-label", p ? "Pause" : "Play");
    if (p) {
      cv.style.display = "none"; img.style.display = "block";
    } else {
      try {
        cv.width = img.naturalWidth || 300; cv.height = img.naturalHeight || 200;
        cv.getContext("2d").drawImage(img, 0, 0);
        img.style.display = "none"; cv.style.display = "block";
      } catch (e) { playing = true; }
    }
  }
  btn.addEventListener("click", function () { setPlay(!playing); });
  img.addEventListener("click", function () { setPlay(!playing); });
  cv.addEventListener("click", function () { setPlay(true); });
})();  
  </script>
</body>
